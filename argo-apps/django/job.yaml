---
## Part of ArgoCD Image Updater configuration
## Adds annotation outside ApplicationSet, since it doesn't allow ${ARGOCD_ENV_CLUSTER_ECR_DOMAIN} replacement
## See /argocd/applicationset.yaml `preservedFields` definition also required for this workaround
apiVersion: batch/v1
kind: Job
metadata:
  name: post-sync-annotations-job
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  template:
    spec:
      serviceAccountName: django
      containers:
        - name: kubectl
          image: bitnami/kubectl:latest
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              kubectl patch application "django" -n argocd --type=merge \
              -p "{\"metadata\":{\"annotations\":{\"argocd-image-updater.argoproj.io/image-list\":\"django=${ARGOCD_ENV_CLUSTER_ECR_DOMAIN}/${ARGOCD_ENV_CLUSTER_NAME}\"}}}"
      restartPolicy: Never

