---
apiVersion: ExternalSecretcrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: django-secrets
  namespace: django
spec:
  refreshInterval: "0"
  secretStoreRef:
    name: django-secrets
    kind: SecretStore
  target:
    name: django-secrets
    creationPolicy: Owner
    immutable: true
  data:
    - secretKey: DB_USERNAME
      remoteRef:
        key: "/app/db/username"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None

    - secretKey: DB_NAME
      remoteRef:
        key: "/app/db/name"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None

    - secretKey: DB_PASSWORD
      remoteRef:
        key: "/app/db/password"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None

    - secretKey: DB_PORT
      remoteRef:
        key: "/app/db/port"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None

    - secretKey: DB_HOST
      remoteRef:
        key: "/app/db/host"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None

    - secretKey: SECRET_KEY
      remoteRef:
        key: "/app/django/secret_key"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None

    - secretKey: DOMAIN
      remoteRef:
        key: "/cluster/domain"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None

    - secretKey: DEBUG
      remoteRef:
        key: "/app/django/debug"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None

---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: django-secrets
  namespace: django
spec:
  provider:
    aws:
      service: ParameterStore
      region: us-west-2
      auth:
        jwt: # requires `sts:AssumeRoleWithWebIdentity` permission (set in tf)
          serviceAccountRef:
            name: django # name of actual serviceAccount (not role)

# DJANGO_ALLOWED_HOSTS=localhost 127.0.0.1 [::1]
# STATIC_ROOT=/static
# DEBUG="True"
