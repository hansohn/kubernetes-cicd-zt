---
# `secretEnvVars:` has to be updated in jenkins/values.yaml with each key (there's no envfrom in the chart)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: jenkins-secrets
  namespace: jenkins
spec:
  refreshInterval: "0"
  secretStoreRef:
    name: jenkins-secrets 
    kind: SecretStore
  target:
    name: jenkins-secrets
    creationPolicy: Owner
    immutable: true
#    template:
#      metadata:
#        labels:
#          "jenkins.io/credentials-type": "secretText"
#        annotations:
#          "jenkins.io/credentials-description": "Jenkins Secrets" # https://external-secrets.io/v0.4.2/examples-jenkins-kubernetes-credentials/ or kubernetes-credentials-provider-plugin
  data:
    - secretKey: ECR_REPO # arbitrary assigned key name, used in Jenkinsfile/Pipeline
      remoteRef:
        key: "ecr/repo_url"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None

    - secretKey: ECR_REPO_NAME
      remoteRef:
        key: "ecr/repo_name"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None

    - secretKey: REGION
      remoteRef:
        key: "aws/region"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None

    - secretKey: REPO_URL
      remoteRef:
        key: "app/repo_url"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None

    - secretKey: GITHUB_USER
      remoteRef:
        key: "jenkins/github/username"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None

    - secretKey: GITHUB_TOKEN
      remoteRef:
        key: "jenkins/github/token"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None

    - secretKey: SONARQUBE_PASSWORD
      remoteRef:
        key: "sonar/admin/password"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None

    - secretKey: jenkins-admin-user
      remoteRef:
        key: "jenkins/admin/username"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None

    - secretKey: jenkins-admin-password
      remoteRef:
        key: "jenkins/admin/password"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: jenkins-secrets
  namespace: jenkins
spec:
  provider:
    aws:
      service: ParameterStore
      region: us-west-2
      auth:
        jwt: # requires `sts:AssumeRoleWithWebIdentity` permission (set in tf)
          serviceAccountRef:
            name: jenkins # name of actual serviceAccount (not role)
