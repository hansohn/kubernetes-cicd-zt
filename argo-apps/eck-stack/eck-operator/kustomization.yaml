---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: eck-stack

helmCharts:
  - name: eck-operator
    repo: https://helm.elastic.co
    version: 2.16.1
    releaseName: eck-operator
    namespace: eck-stack
    includeCRDs: true
    valuesFile: values.yaml

resources:
  - serviceaccount.yaml
