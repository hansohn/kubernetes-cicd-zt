---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd

helmCharts:
  - name: argo-cd
    repo: https://argoproj.github.io/argo-helm
    version: 7.8.2
    releaseName: argo-cd
    namespace: argocd
    valuesFile: values.yaml
    valuesMerge: merge
    includeCRDs: true

resources:
  # - job.yaml
  - secrets.yaml
  - ingress.yaml
  - rbac.yaml

patches:
  - path: init-container.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: argo-cd-argocd-repo-server
      namespace: argocd
