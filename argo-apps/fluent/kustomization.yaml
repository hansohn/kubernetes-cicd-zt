---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: fluent

helmCharts:
  - name: fluent-operator
    repo: https://fluent.github.io/helm-charts
    version: 3.2.0
    releaseName: fluent-operator
    namespace: fluent
    includeCRDs: true
    valuesFile: values.yaml

resources:
  - secrets.yaml
  - rbac.yaml
  - job.yaml
