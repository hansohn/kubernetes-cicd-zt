---
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-image-updater-config
  namespace: argocd
data:
  kube.events: 'false'
  log.level: "trace"
  registries.conf: |
    registries:
      - api_url: https://${CLUSTER_ECR_DOMAIN}
        credentials: ext:/scripts/ecr-login.sh
        credsexpire: 6h
        default: true
        insecure: false
        name: ECR
        ping: true
        prefix: ${CLUSTER_ECR_DOMAIN}
        tagsortmode: none
